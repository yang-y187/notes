<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc">
  <title id="title">Runnable与LCEL执行模式</title>
  <desc id="desc">展示LCEL管道构造、同步与异步调用差别、批量返回顺序，以及流式传播被需要完整输入的组件阻塞的原理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 31px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}.panel{font:700 21px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.h{font:700 17px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.body{font:400 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#334155}.small{font:400 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}.mono{font:500 14px Consolas,"Microsoft YaHei",sans-serif;fill:#1e3a8a}
    </style>
  </defs>
  <rect width="1540" height="900" rx="26" fill="url(#bg)"/>
  <text x="62" y="62" class="title">Runnable统一的是执行协议，LCEL描述的是组合关系</text>
  <text x="62" y="92" class="subtitle">同一条逻辑管道可以选择同步、异步、批量或流式入口，但底层能力仍取决于每个组件。</text>

  <rect x="52" y="130" width="1436" height="220" rx="22" fill="#fff" stroke="#cbd5e1"/>
  <text x="82" y="170" class="panel">一、管道操作符 | 先构造RunnableSequence，不会立刻执行</text>
  <rect x="95" y="200" width="1040" height="122" rx="18" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="8 6"/>
  <rect x="900" y="184" width="220" height="38" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1010" y="209" text-anchor="middle" class="h">RunnableSequence</text>
  <rect x="120" y="220" width="240" height="80" rx="15" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="240" y="252" text-anchor="middle" class="h">Prompt Runnable</text><text x="240" y="280" text-anchor="middle" class="small">dict → PromptValue</text>
  <rect x="495" y="220" width="240" height="80" rx="15" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="615" y="252" text-anchor="middle" class="h">Model Runnable</text><text x="615" y="280" text-anchor="middle" class="small">PromptValue → AIMessage</text>
  <rect x="870" y="220" width="240" height="80" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="990" y="252" text-anchor="middle" class="h">Parser Runnable</text><text x="990" y="280" text-anchor="middle" class="small">AIMessage → 目标对象</text>
  <rect x="1210" y="220" width="230" height="80" rx="16" fill="#f8fafc" stroke="#94a3b8"/><text x="1325" y="249" text-anchor="middle" class="h">LCEL构造表达式</text><text x="1325" y="277" text-anchor="middle" class="mono">prompt | model | parser</text>
  <path d="M360 260H495" stroke="#2563eb" stroke-width="2.7" marker-end="url(#arrowBlue)"/>
  <path d="M735 260H870" stroke="#2563eb" stroke-width="2.7" marker-end="url(#arrowBlue)"/>
  <path d="M1210 260H1135" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="1168" y="246" text-anchor="middle" class="small">构造</text>

  <rect x="52" y="382" width="695" height="438" rx="22" fill="#fff" stroke="#cbd5e1"/>
  <text x="82" y="424" class="panel">二、同步、异步与批量关注“怎样等待”</text>
  <rect x="88" y="466" width="274" height="94" rx="15" fill="#f8fafc" stroke="#94a3b8"/><text x="110" y="495" class="mono">invoke(x)</text><text x="110" y="522" class="body">当前调用阻塞至完整结果</text><text x="110" y="545" class="small">适合单次、简单同步路径</text>
  <rect x="420" y="466" width="274" height="94" rx="15" fill="#eff6ff" stroke="#60a5fa"/><text x="442" y="495" class="mono">ainvoke(x)</text><text x="442" y="522" class="body">等待IO时让出事件循环</text><text x="442" y="545" class="small">提高并发吞吐，不缩短模型推理</text>

  <text x="94" y="618" class="h">异步并发：等待区间可以重叠</text>
  <text x="94" y="655" class="small">请求A</text><rect x="160" y="637" width="150" height="28" rx="8" fill="#60a5fa"/><rect x="310" y="637" width="175" height="28" rx="8" fill="#dbeafe"/><rect x="485" y="637" width="110" height="28" rx="8" fill="#60a5fa"/>
  <text x="94" y="697" class="small">请求B</text><rect x="160" y="679" width="85" height="28" rx="8" fill="#60a5fa"/><rect x="245" y="679" width="210" height="28" rx="8" fill="#dbeafe"/><rect x="455" y="679" width="140" height="28" rx="8" fill="#60a5fa"/>
  <text x="94" y="739" class="small">请求C</text><rect x="160" y="721" width="110" height="28" rx="8" fill="#60a5fa"/><rect x="270" y="721" width="120" height="28" rx="8" fill="#dbeafe"/><rect x="390" y="721" width="205" height="28" rx="8" fill="#60a5fa"/>
  <text x="160" y="774" class="small">蓝色：本地处理　浅蓝：等待网络/模型</text>
  <rect x="88" y="786" width="606" height="22" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="391" y="802" text-anchor="middle" class="small">batch / abatch可并发执行，但默认结果仍按输入顺序返回</text>

  <rect x="785" y="382" width="703" height="438" rx="22" fill="#fff" stroke="#cbd5e1"/>
  <text x="815" y="424" class="panel">三、流式关注“Chunk能否逐层向下传播”</text>
  <rect x="832" y="478" width="170" height="82" rx="14" fill="#eef2ff" stroke="#818cf8"/><text x="917" y="510" text-anchor="middle" class="h">Model Stream</text><text x="917" y="537" text-anchor="middle" class="small">Chunk 1、2、3…</text>
  <rect x="1070" y="478" width="170" height="82" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="1155" y="510" text-anchor="middle" class="h">增量转换器</text><text x="1155" y="537" text-anchor="middle" class="small">每个Chunk立即处理</text>
  <rect x="1308" y="478" width="130" height="82" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="1373" y="510" text-anchor="middle" class="h">消费者</text><text x="1373" y="537" text-anchor="middle" class="small">逐步显示</text>
  <path d="M1002 519H1070M1240 519H1308" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1135" y="589" text-anchor="middle" class="small">完整流式路径：首个Chunk可以尽早到达消费者</text>

  <rect x="832" y="650" width="170" height="82" rx="14" fill="#eef2ff" stroke="#818cf8"/><text x="917" y="682" text-anchor="middle" class="h">Model Stream</text><text x="917" y="709" text-anchor="middle" class="small">Chunk 1、2、3…</text>
  <rect x="1062" y="638" width="190" height="106" rx="14" fill="#fff1f2" stroke="#f87171" stroke-width="2"/><text x="1157" y="674" text-anchor="middle" class="h">阻塞组件</text><text x="1157" y="701" text-anchor="middle" class="body">必须等待完整输入</text><text x="1157" y="724" text-anchor="middle" class="small">例如非增量Parser</text>
  <rect x="1308" y="650" width="130" height="82" rx="14" fill="#f8fafc" stroke="#94a3b8"/><text x="1373" y="682" text-anchor="middle" class="h">消费者</text><text x="1373" y="709" text-anchor="middle" class="small">一次性收到</text>
  <path d="M1002 691H1062M1252 691H1308" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1155" y="778" text-anchor="middle" class="body">Chunk不等于Token；流式降低TTFT，不保证总耗时更短</text>

  <rect x="223" y="850" width="1094" height="32" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="770" y="872" text-anchor="middle" class="body">选择入口不会修复组件能力：同步组件、阻塞Parser、限流与数据类型不兼容仍需单独处理。</text>
</svg>
