<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="940" viewBox="0 0 1540 940" role="img" aria-labelledby="title desc">
  <title id="title">Middleware的Node-style与Wrap-style执行机制</title>
  <desc id="desc">左侧展示Node-style生命周期前后顺序，右侧用洋葱嵌套图展示多个Wrap-style Middleware进入与退出的相反顺序。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 31px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}
      .panel{font:700 22px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.h{font:700 17px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.body{font:400 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#334155}.small{font:400 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}.light{font:700 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:white}
    </style>
  </defs>
  <rect width="1540" height="940" rx="26" fill="url(#bg)"/>
  <text x="62" y="62" class="title">Middleware两种执行形态：生命周期节点与调用洋葱</text>
  <text x="62" y="92" class="subtitle">Node-style在图的生命周期边界运行；Wrap-style直接包围一次真实Model或Tool调用。</text>

  <rect x="50" y="128" width="700" height="700" rx="22" fill="#fff" stroke="#cbd5e1"/>
  <text x="82" y="172" class="panel">一、Node-style：进入顺序与退出顺序</text>
  <text x="82" y="199" class="small">A、B、C按注册顺序进入；对应的after阶段反向退出。</text>

  <rect x="93" y="247" width="220" height="96" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="203" y="282" text-anchor="middle" class="h">before_agent</text><text x="203" y="312" text-anchor="middle" class="body">A → B → C</text><text x="203" y="332" text-anchor="middle" class="small">每次Agent调用一次</text>
  <rect x="440" y="247" width="220" height="96" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="550" y="282" text-anchor="middle" class="h">before_model</text><text x="550" y="312" text-anchor="middle" class="body">A → B → C</text><text x="550" y="332" text-anchor="middle" class="small">每轮模型调用前</text>
  <path d="M313 295H440" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <rect x="440" y="410" width="220" height="92" rx="16" fill="#334155"/>
  <text x="550" y="447" text-anchor="middle" class="light">真实 Model 调用</text><text x="550" y="476" text-anchor="middle" style="font:400 13px 'Microsoft YaHei',sans-serif;fill:#e2e8f0">可能触发Tools循环</text>
  <path d="M550 343V410" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <rect x="440" y="570" width="220" height="96" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="550" y="605" text-anchor="middle" class="h">after_model</text><text x="550" y="635" text-anchor="middle" class="body">C → B → A</text><text x="550" y="655" text-anchor="middle" class="small">每轮模型返回后</text>
  <path d="M550 502V570" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <polygon points="352,579 422,618 352,657 282,618" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="352" y="614" text-anchor="middle" class="body">继续循环？</text>
  <path d="M440 618H422" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M352 579V370H550V343" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="366" y="396" class="small">是：回到before_model</text>

  <rect x="93" y="570" width="180" height="96" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="183" y="605" text-anchor="middle" class="h">after_agent</text><text x="183" y="635" text-anchor="middle" class="body">C → B → A</text><text x="183" y="655" text-anchor="middle" class="small">正常退出前一次</text>
  <path d="M282 618H273" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/><text x="274" y="601" text-anchor="end" class="small">否</text>

  <rect x="92" y="720" width="568" height="72" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="116" y="750" class="h">State Update仍经过Reducer</text>
  <text x="116" y="775" class="body">Node-style适合在明确生命周期边界读取State、更新State或改变路由。</text>

  <rect x="790" y="128" width="700" height="700" rx="22" fill="#fff" stroke="#cbd5e1"/>
  <text x="822" y="172" class="panel">二、Wrap-style：A(B(C(handler)))</text>
  <text x="822" y="199" class="small">外层先进入、后退出；每层都可以修改、短路或重复调用下一层。</text>

  <rect x="850" y="240" width="580" height="500" rx="34" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="878" y="278" class="h">Middleware A（最外层）</text>
  <rect x="910" y="300" width="460" height="380" rx="30" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
  <text x="938" y="338" class="h">Middleware B</text>
  <rect x="970" y="360" width="340" height="260" rx="26" fill="#cffafe" stroke="#22d3ee" stroke-width="3"/>
  <text x="998" y="398" class="h">Middleware C</text>
  <rect x="1040" y="430" width="200" height="120" rx="22" fill="#334155"/>
  <text x="1140" y="476" text-anchor="middle" class="light">handler</text>
  <text x="1140" y="505" text-anchor="middle" style="font:400 13px 'Microsoft YaHei',sans-serif;fill:#e2e8f0">真实Model / Tool调用</text>

  <path d="M814 390H850M850 390H910M910 410H970M970 455H1040" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="816" y="370" class="h">进入</text>
  <text x="862" y="376" class="small">A</text><text x="922" y="396" class="small">B</text><text x="982" y="441" class="small">C</text>

  <path d="M1240 526H1278V600H1310M1310 600H1370M1370 600H1430" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1418" y="580" text-anchor="end" class="h">退出</text>
  <text x="1254" y="553" class="small">C</text><text x="1319" y="585" class="small">B</text><text x="1380" y="585" class="small">A</text>

  <rect x="838" y="764" width="604" height="42" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1140" y="791" text-anchor="middle" class="body">Retry / Fallback：多次调用handler　　Cache / Guardrail：可能不调用handler</text>

  <rect x="78" y="856" width="1384" height="54" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="770" y="890" text-anchor="middle" class="body">顺序本身就是业务设计：鉴权应早于缓存读取，HITL应靠近真实副作用，Retry前必须先保证写操作幂等。</text>
</svg>
