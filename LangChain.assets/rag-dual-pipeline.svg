<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">RAG离线索引链与在线问答链</title>
  <desc id="desc">用双泳道展示RAG的离线数据索引和在线检索生成流程，标出可选的Query改写与Rerank，以及共享索引和分层评估位置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f0fdfa"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 31px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}
      .lane{font:700 21px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.h{font:700 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.body{font:400 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#334155}.small{font:400 11px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}.step{font:700 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#2563eb}
    </style>
  </defs>
  <rect width="1800" height="1040" rx="26" fill="url(#bg)"/>
  <text x="62" y="62" class="title">RAG是两条链路：先建设可检索知识，再为问题组织证据</text>
  <text x="62" y="92" class="subtitle">离线链决定“库里有什么”；在线链决定“这次找到什么、怎样交给模型”。两条链必须分层调试和评估。</text>

  <rect x="52" y="130" width="1696" height="330" rx="22" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="52" y="130" width="188" height="330" rx="22" fill="#dbeafe"/>
  <text x="146" y="195" text-anchor="middle" class="lane">离线 / 异步</text>
  <text x="146" y="226" text-anchor="middle" class="body">索引建设链</text>
  <text x="146" y="278" text-anchor="middle" class="small">决定数据质量</text>
  <text x="146" y="300" text-anchor="middle" class="small">Chunk与Metadata</text>

  <g>
    <rect x="278" y="198" width="188" height="108" rx="16" fill="#fff" stroke="#60a5fa"/><text x="372" y="230" text-anchor="middle" class="step">01</text><text x="372" y="257" text-anchor="middle" class="h">数据源</text><text x="372" y="282" text-anchor="middle" class="body">文件 / 网页 / DB / API</text>
    <rect x="510" y="198" width="188" height="108" rx="16" fill="#fff" stroke="#60a5fa"/><text x="604" y="230" text-anchor="middle" class="step">02</text><text x="604" y="257" text-anchor="middle" class="h">加载与解析</text><text x="604" y="282" text-anchor="middle" class="body">正文、标题、表格、页码</text>
    <rect x="742" y="198" width="188" height="108" rx="16" fill="#fff" stroke="#60a5fa"/><text x="836" y="230" text-anchor="middle" class="step">03</text><text x="836" y="257" text-anchor="middle" class="h">清洗与版本化</text><text x="836" y="282" text-anchor="middle" class="body">去噪、去重、稳定ID</text>
    <rect x="974" y="198" width="188" height="108" rx="16" fill="#fff" stroke="#60a5fa"/><text x="1068" y="230" text-anchor="middle" class="step">04</text><text x="1068" y="257" text-anchor="middle" class="h">Chunk</text><text x="1068" y="282" text-anchor="middle" class="body">语义边界 + Metadata</text>
    <rect x="1206" y="198" width="188" height="108" rx="16" fill="#fff" stroke="#60a5fa"/><text x="1300" y="230" text-anchor="middle" class="step">05</text><text x="1300" y="257" text-anchor="middle" class="h">检索表示</text><text x="1300" y="282" text-anchor="middle" class="body">Embedding / 关键词</text>
    <rect x="1438" y="185" width="250" height="134" rx="18" fill="#1d4ed8"/><text x="1563" y="226" text-anchor="middle" style="font:700 18px 'Microsoft YaHei',sans-serif;fill:white">Index / Store</text><text x="1563" y="258" text-anchor="middle" style="font:400 13px 'Microsoft YaHei',sans-serif;fill:#dbeafe">索引 + 原文 + Metadata</text><text x="1563" y="284" text-anchor="middle" style="font:400 12px 'Microsoft YaHei',sans-serif;fill:#bfdbfe">可追踪版本与稳定ID</text>
    <path d="M466 252H510" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M698 252H742" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M930 252H974" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M1162 252H1206" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M1394 252H1438" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  </g>
  <rect x="278" y="351" width="1410" height="68" rx="14" fill="#fff" stroke="#bfdbfe"/>
  <text x="304" y="380" class="h">索引层评估</text><text x="304" y="405" class="body">解析完整性　·　Chunk可理解性　·　Metadata正确性　·　版本更新与删除一致性</text>

  <rect x="52" y="495" width="1696" height="430" rx="22" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="52" y="495" width="188" height="430" rx="22" fill="#d1fae5"/>
  <text x="146" y="560" text-anchor="middle" class="lane">在线 / 实时</text>
  <text x="146" y="591" text-anchor="middle" class="body">检索问答链</text>
  <text x="146" y="643" text-anchor="middle" class="small">决定本轮证据</text>
  <text x="146" y="665" text-anchor="middle" class="small">相关性与Grounding</text>

  <g>
    <rect x="278" y="570" width="174" height="108" rx="16" fill="#fff" stroke="#34d399"/><text x="365" y="603" text-anchor="middle" class="step">01</text><text x="365" y="630" text-anchor="middle" class="h">用户问题</text><text x="365" y="655" text-anchor="middle" class="body">结合会话上下文</text>
    <rect x="488" y="570" width="174" height="108" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5"/><text x="575" y="603" text-anchor="middle" class="step">可选</text><text x="575" y="630" text-anchor="middle" class="h">Query改写</text><text x="575" y="655" text-anchor="middle" class="body">生成独立检索问题</text>
    <rect x="698" y="570" width="174" height="108" rx="16" fill="#fff" stroke="#34d399"/><text x="785" y="603" text-anchor="middle" class="step">02</text><text x="785" y="630" text-anchor="middle" class="h">权限Filter</text><text x="785" y="655" text-anchor="middle" class="body">服务端鉴权结果</text>
    <rect x="908" y="570" width="174" height="108" rx="16" fill="#fff" stroke="#34d399"/><text x="995" y="603" text-anchor="middle" class="step">03</text><text x="995" y="630" text-anchor="middle" class="h">Retriever召回</text><text x="995" y="655" text-anchor="middle" class="body">Dense / Sparse / Hybrid</text>
    <rect x="1118" y="570" width="174" height="108" rx="16" fill="#fff" stroke="#34d399"/><text x="1205" y="603" text-anchor="middle" class="step">04</text><text x="1205" y="630" text-anchor="middle" class="h">候选处理</text><text x="1205" y="655" text-anchor="middle" class="body">过滤、去重、融合</text>
    <rect x="1328" y="570" width="174" height="108" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5"/><text x="1415" y="603" text-anchor="middle" class="step">可选</text><text x="1415" y="630" text-anchor="middle" class="h">Rerank</text><text x="1415" y="655" text-anchor="middle" class="body">只重排已有候选</text>
    <path d="M452 624H488" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M662 624H698" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M872 624H908" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1082 624H1118" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1292 624H1328" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M452 596V532H785V570" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <text x="560" y="522" class="small">无需改写时直接进入权限Filter</text>
  </g>

  <rect x="698" y="739" width="220" height="102" rx="16" fill="#fff" stroke="#34d399"/><text x="808" y="773" text-anchor="middle" class="step">05</text><text x="808" y="800" text-anchor="middle" class="h">上下文组装</text><text x="808" y="825" text-anchor="middle" class="body">顺序、边界、Token预算</text>
  <rect x="1000" y="739" width="220" height="102" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="1110" y="773" text-anchor="middle" class="step">06</text><text x="1110" y="800" text-anchor="middle" class="h">LLM生成</text><text x="1110" y="825" text-anchor="middle" class="body">Grounding / 引用 / 拒答</text>
  <rect x="1302" y="739" width="254" height="102" rx="16" fill="#fff" stroke="#34d399"/><text x="1429" y="773" text-anchor="middle" class="step">07</text><text x="1429" y="800" text-anchor="middle" class="h">在线与端到端评估</text><text x="1429" y="825" text-anchor="middle" class="body">相关性、忠实度、正确性、成本</text>
  <path d="M1415 678V704H860V739" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1205 678V724H756V739" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="1010" y="716" class="small">无需Rerank时直接组装上下文</text>
  <path d="M918 790H1000" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1220 790H1302" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M1563 319V500H995V570" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="1198" y="444" width="336" height="48" rx="12" fill="#fff" stroke="#93c5fd"/>
  <text x="1366" y="474" text-anchor="middle" class="body">共享索引只提供候选，不能保证最终答案正确</text>

  <rect x="270" y="956" width="1258" height="50" rx="13" fill="#fff1f2" stroke="#fda4af"/>
  <text x="899" y="987" text-anchor="middle" class="body">排错顺序：候选没有证据 → 查数据/解析/Chunk/召回；候选有但排后 → 查融合/Filter/Rerank；上下文正确但回答错 → 查Prompt/模型/生成约束。</text>
</svg>
