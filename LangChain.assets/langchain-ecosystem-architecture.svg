<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">LangChain生态分层与协作关系</title>
  <desc id="desc">展示langchain-core、供应商与社区集成、LangChain、LangGraph、Deep Agents和LangSmith之间的职责及依赖关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 32px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}
      .name{font:700 22px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}
      .nameLight{font:700 22px "Microsoft YaHei","PingFang SC",sans-serif;fill:#fff}
      .body{font:400 15px "Microsoft YaHei","PingFang SC",sans-serif;fill:#334155}
      .bodyLight{font:400 15px "Microsoft YaHei","PingFang SC",sans-serif;fill:#eef2ff}
      .edge{font:500 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}
      .small{font:400 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}
    </style>
  </defs>

  <rect width="1440" height="860" rx="26" fill="url(#bg)"/>
  <text x="64" y="64" class="title">LangChain生态：协议、应用与运行时如何分工</text>
  <text x="64" y="94" class="subtitle">从下到上是能力复用关系；右侧 LangSmith 横切记录运行过程，不参与业务控制。</text>

  <g filter="url(#shadow)">
    <rect x="430" y="126" width="560" height="112" rx="20" fill="url(#deep)"/>
    <text x="710" y="169" text-anchor="middle" class="nameLight">Deep Agents</text>
    <text x="710" y="199" text-anchor="middle" class="bodyLight">规划 · 文件系统 · Skills · Subagent · 长任务 Harness</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="238" y="322" width="430" height="138" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="453" y="365" text-anchor="middle" class="name">LangChain</text>
    <text x="453" y="397" text-anchor="middle" class="body">Agent · Middleware · 模型初始化</text>
    <text x="453" y="426" text-anchor="middle" class="small">提供面向应用的高层抽象</text>

    <rect x="752" y="322" width="430" height="138" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="967" y="365" text-anchor="middle" class="name">LangGraph</text>
    <text x="967" y="397" text-anchor="middle" class="body">State · Node · Edge · Reducer</text>
    <text x="967" y="426" text-anchor="middle" class="small">循环、分支、Checkpoint 与 Interrupt</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="554" width="320" height="116" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="280" y="594" text-anchor="middle" class="name">供应商集成包</text>
    <text x="280" y="626" text-anchor="middle" class="body">langchain-openai 等</text>
    <text x="280" y="650" text-anchor="middle" class="small">把模型 API 适配为统一接口</text>

    <rect x="500" y="554" width="320" height="116" rx="16" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="660" y="594" text-anchor="middle" class="name">社区集成包</text>
    <text x="660" y="626" text-anchor="middle" class="body">langchain-community</text>
    <text x="660" y="650" text-anchor="middle" class="small">承载社区维护的外部集成</text>

    <rect x="286" y="726" width="768" height="92" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="670" y="763" text-anchor="middle" class="name">langchain-core：统一协议地基</text>
    <text x="670" y="793" text-anchor="middle" class="body">Message · Prompt · Runnable · Tool · Callback</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1240" y="244" width="156" height="426" rx="20" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="1318" y="293" text-anchor="middle" class="name">LangSmith</text>
    <line x1="1270" y1="318" x2="1366" y2="318" stroke="#c084fc"/>
    <text x="1318" y="354" text-anchor="middle" class="body">Tracing</text>
    <text x="1318" y="386" text-anchor="middle" class="body">Evaluation</text>
    <text x="1318" y="418" text-anchor="middle" class="body">Experiment</text>
    <text x="1318" y="450" text-anchor="middle" class="body">Monitoring</text>
    <text x="1318" y="509" text-anchor="middle" class="small">观察与评估</text>
    <text x="1318" y="535" text-anchor="middle" class="small">不保存 Agent</text>
    <text x="1318" y="558" text-anchor="middle" class="small">执行状态</text>
  </g>

  <path d="M668 391 H752" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="710" y="376" text-anchor="middle" class="edge">Agent 编译为状态图</text>

  <path d="M453 322 C500 274 560 246 630 238" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M967 322 C920 274 860 246 790 238" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="710" y="278" text-anchor="middle" class="edge">共同支撑复杂 Agent Harness</text>

  <path d="M280 554 C288 500 340 477 408 460" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M660 554 C625 505 560 480 510 460" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/>

  <path d="M500 726 L330 670" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M640 726 L640 671" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M440 726 C470 650 470 540 453 461" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M800 726 C865 650 920 540 952 461" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="926" y="704" class="edge">统一对象与调用契约</text>

  <path d="M668 345 C860 260 1090 280 1240 344" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <path d="M1182 425 C1208 438 1218 449 1240 463" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1010" y="286" text-anchor="middle" class="small">LangChain / Runnable启用Tracing后上报Run</text>
  <text x="1212" y="445" text-anchor="middle" class="small">LangGraph Run</text>

  <rect x="64" y="732" width="176" height="82" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="152" y="762" text-anchor="middle" class="small">记忆口诀</text>
  <text x="152" y="788" text-anchor="middle" class="body">Core 定协议</text>
  <text x="152" y="810" text-anchor="middle" class="body">Graph 管执行</text>
</svg>
