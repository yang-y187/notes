<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">LangSmith中Project、Thread、Trace和Run的关系</title>
  <desc id="desc">Project按应用归档Trace，Thread通过会话标识横向关联多轮Trace，每个Trace内部是一棵Run树。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcff"/><stop offset="1" stop-color="#f4f0ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .title{font:700 31px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475569}
      .h{font:700 21px "Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.body{font:400 15px "Microsoft YaHei","PingFang SC",sans-serif;fill:#334155}.small{font:400 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#64748b}
      .trace{fill:#fff;stroke:#818cf8;stroke-width:2}.run{fill:#eef2ff;stroke:#a5b4fc;stroke-width:1.5}.tool{fill:#ecfeff;stroke:#67e8f9;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="850" rx="26" fill="url(#bg)"/>
  <text x="64" y="62" class="title">LangSmith对象关系：不是一条简单的父子链</text>
  <text x="64" y="92" class="subtitle">Project 与 Thread 是组织 Trace 的两个不同维度；Trace 内部才是具有父子关系的 Run 树。</text>

  <rect x="70" y="130" width="1300" height="650" rx="24" fill="#f8fafc"/>
  <rect x="135" y="148" width="520" height="116" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="395" y="187" text-anchor="middle" class="h">Project：应用 / 服务 / 环境维度</text>
  <text x="395" y="218" text-anchor="middle" class="body">把不同请求产生的Trace归档到同一项目</text>
  <text x="395" y="242" text-anchor="middle" class="small">例如：production-chatbot</text>

  <rect x="785" y="148" width="520" height="116" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
  <text x="1045" y="187" text-anchor="middle" class="h">Thread：同一会话的跨轮维度</text>
  <text x="1045" y="218" text-anchor="middle" class="body">通过thread_id等Metadata关联多轮Trace</text>
  <text x="1045" y="242" text-anchor="middle" class="small">不是执行状态的持久化容器</text>
  <path d="M395 264C360 290 320 305 300 330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M395 264C560 292 790 302 920 330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1045 264C870 286 650 304 520 330" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M1045 264C1090 288 1140 306 1160 330" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="135" y="330" width="520" height="392" rx="20" class="trace"/>
    <rect x="785" y="330" width="520" height="392" rx="20" class="trace"/>
  </g>
  <rect x="159" y="351" width="200" height="46" rx="10" fill="#4f46e5"/>
  <text x="259" y="381" text-anchor="middle" style="font:700 18px 'Microsoft YaHei',sans-serif;fill:white">Trace 1：第一轮请求</text>
  <rect x="809" y="351" width="200" height="46" rx="10" fill="#4f46e5"/>
  <text x="909" y="381" text-anchor="middle" style="font:700 18px 'Microsoft YaHei',sans-serif;fill:white">Trace 2：第二轮请求</text>

  <rect x="280" y="430" width="230" height="62" rx="13" class="run"/>
  <text x="395" y="458" text-anchor="middle" class="h">根 Run</text>
  <text x="395" y="480" text-anchor="middle" class="small">Agent / 应用调用</text>
  <rect x="166" y="560" width="190" height="62" rx="13" class="run"/>
  <text x="261" y="588" text-anchor="middle" class="body">Model 子 Run</text>
  <text x="261" y="610" text-anchor="middle" class="small">模型调用</text>
  <rect x="430" y="560" width="190" height="62" rx="13" class="tool"/>
  <text x="525" y="588" text-anchor="middle" class="body">Tool 子 Run</text>
  <text x="525" y="610" text-anchor="middle" class="small">工具执行</text>
  <rect x="430" y="648" width="190" height="52" rx="12" class="tool"/>
  <text x="525" y="681" text-anchor="middle" class="body">Retriever 孙 Run（示例）</text>
  <path d="M395 492V526H261V560M395 526H525V560M525 622V648" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="930" y="430" width="230" height="62" rx="13" class="run"/>
  <text x="1045" y="458" text-anchor="middle" class="h">根 Run</text>
  <text x="1045" y="480" text-anchor="middle" class="small">下一轮 Agent 调用</text>
  <rect x="818" y="560" width="190" height="62" rx="13" class="run"/>
  <text x="913" y="588" text-anchor="middle" class="body">Model 子 Run</text>
  <text x="913" y="610" text-anchor="middle" class="small">读取新一轮上下文</text>
  <rect x="1080" y="560" width="190" height="62" rx="13" class="tool"/>
  <text x="1175" y="588" text-anchor="middle" class="body">Tool 子 Run</text>
  <text x="1175" y="610" text-anchor="middle" class="small">可选执行步骤</text>
  <path d="M1045 492V526H913V560M1045 526H1175V560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <circle cx="151" cy="814" r="7" fill="#334155"/><text x="168" y="820" class="small">Project：归档范围</text>
    <circle cx="384" cy="814" r="7" fill="#c084fc"/><text x="401" y="820" class="small">Thread：跨轮会话</text>
    <circle cx="616" cy="814" r="7" fill="#6366f1"/><text x="633" y="820" class="small">Trace：一次完整操作</text>
    <circle cx="882" cy="814" r="7" fill="#a5b4fc"/><text x="899" y="820" class="small">Run：一个执行步骤</text>
  </g>
</svg>
